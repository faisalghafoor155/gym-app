# The same site as nginx.conf, served over TLS.
#
# Kept as a separate file rather than as `if ($scheme = http)` inside the
# default one, because the plain-http stack has to keep working unchanged for
# local runs: a config that redirects to https on localhost, where no
# certificate exists, is a stack nobody can open. This file is mounted over the
# default only when the app actually sits behind a certificate — see
# docker-compose.https.yml.
#
# Two server blocks, and the split matters:
#
#   * :80 does nothing but redirect and answer ACME challenges. It must not
#     serve the app, or a downgrade attack has something to downgrade to.
#   * :443 serves everything, and is the only block that sets HSTS.

# ---- plain http: redirect, and let certbot renew ----
server {
    listen 80;
    server_name ${DOMAIN};

    # Certbot writes its challenge file here and Let's Encrypt reads it over
    # port 80. This location has to come *before* the redirect, or the
    # challenge is redirected to https — which is exactly what cannot be
    # served yet on a first issuance, and renewals then fail forever.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- https: the actual site ----
server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # TLS 1.2 is still here because some older Android phones in the field
    # cannot do 1.3, and a gym member locked out of the portal by their handset
    # is a support call. 1.0 and 1.1 are gone — they are broken, not merely old.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling: the browser gets the revocation proof from us instead of
    # calling the CA itself, which is one fewer round trip and one fewer thing
    # that can hang the page load.
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/${DOMAIN}/chain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Helmet already sends HSTS on API responses, but static assets come from
    # nginx and never touch Express — so without this, a plain-http first visit
    # to the app shell is not covered.
    #
    # `preload` is deliberately NOT set. Getting onto the preload list is easy
    # and getting off it takes months, during which the domain and every
    # subdomain is https-only in every browser. Add it once you are certain.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    # Member photos are base64 data-URLs posted as JSON; keep this in sync
    # with the express.json limit in the backend.
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker's embedded DNS. Needed because nginx resolves names in `proxy_pass`
    # once at startup and caches the result forever: recreating the backend
    # gives it a new container IP, and nginx keeps dialling the old one, so
    # every /api call fails with 502 until nginx itself is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # Naming the upstream through a variable defers resolution to request
        # time, so a recreated backend is picked up within the TTL above.
        set $upstream_backend backend;

        # A variable in proxy_pass drops the URI rewrite nginx would otherwise
        # do for a location-prefixed pass, so $request_uri is restored by hand.
        # Without it every proxied path would arrive at the backend as "/".
        proxy_pass         http://$upstream_backend:5000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Now genuinely https, which is what makes the backend mark the session
        # cookie Secure and build https links in reset emails.
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed Vite assets are immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback for react-router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
