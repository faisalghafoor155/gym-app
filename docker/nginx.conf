server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Member photos are base64 data-URLs posted as JSON; keep this in sync
    # with the express.json limit in the backend.
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The app shell and its assets come from nginx and never touch Express, so
    # helmet's headers do not reach them. Without these another site could load
    # the signed-in app in a frame and trick staff into clicking "delete
    # member". frame-ancestors only says who may frame the page; it blocks no
    # script, image or API call, so it cannot break the app.
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The frontend calls a relative `/api` baseURL, so nginx proxies it
    # to the backend container over the compose network.
    #
    # Docker's embedded DNS. Needed because nginx resolves names in `proxy_pass`
    # once at startup and caches the result forever: recreating the backend
    # gives it a new container IP, and nginx keeps dialling the old one, so
    # every /api call fails with 502 until nginx itself is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    location /api/ {
        # Naming the upstream through a variable defers resolution to request
        # time, so a recreated backend is picked up within the TTL above.
        set $upstream_backend backend;

        # A variable in proxy_pass drops the URI rewrite nginx would otherwise
        # do for a location-prefixed pass, so $request_uri is restored by hand.
        # Without it every proxied path would arrive at the backend as "/".
        proxy_pass         http://$upstream_backend:5000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed Vite assets are immutable.
    #
    # An add_header inside a location replaces every add_header from the server
    # block rather than adding to them, so the security headers are repeated
    # here or the assets would go out without them.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback for react-router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
