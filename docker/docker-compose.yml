name: gym-app

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # A nightly pg_dump, kept for BACKUP_KEEP_DAYS.
  #
  # The same postgres image as the database, so pg_dump is guaranteed to match
  # the server version — a dump taken by an older client against a newer server
  # is refused outright, and one taken by a newer client can produce SQL the
  # server cannot restore.
  #
  # Backups land in ./backups on the host rather than a named volume, on
  # purpose: a backup that lives only inside Docker is lost to the same
  # `docker compose down -v` that loses the database. It has to be somewhere an
  # operator can see, copy, and take off the machine.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      # pg_dump reads this rather than prompting; without it the container
      # would sit waiting for a password nobody can type.
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      # Encrypts each dump before it is written. A dump is a plaintext copy of
      # every member's name, phone, address and payment history, and it gets
      # carried off this machine — to a laptop, a USB stick, an object store.
      # Unset means plaintext, and the container says so on every start.
      #
      # NOT the same key as BIOMETRIC_KEY, and not stored next to the backups:
      # a key beside the thing it encrypts protects nobody.
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      # Offsite copy. Any S3-compatible store — AWS, Backblaze B2, Cloudflare
      # R2, Wasabi, MinIO. Without this the dumps only exist on the same disk
      # as the database they protect, which is not a backup.
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      # Only for non-AWS providers; AWS is derived from bucket and region.
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-}
      # A dedicated, write-only key. These credentials sit on the same machine
      # as the database, so one that can also delete would let anyone who takes
      # the machine take the backups too.
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - ./backup.sh:/usr/local/bin/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

  # The build context is this docker folder (which owns .dockerignore);
  # the app source comes in as a named context so no Docker files have to
  # live inside backend/ or frontend/.
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
      additional_contexts:
        src: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      # Encrypts fingerprint templates. Required — the backend exits at boot
      # without it. Losing it means every member has to be enrolled again, so
      # keep a copy outside the database backup.
      BIOMETRIC_KEY: ${BIOMETRIC_KEY}
      PORT: 5000
      NODE_ENV: production
      # The browser talks to nginx, which proxies /api to this container, so
      # API calls are same-origin and no cross-origin allowlist is needed.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # One proxy (the nginx container) sits in front of the API, so per-IP
      # rate limiting reads the real client IP instead of nginx's.
      TRUST_PROXY_HOPS: 1
      # This stack is served over plain http on localhost. A Secure session
      # cookie would be dropped by the browser there, so it is switched off
      # until the app sits behind TLS — set HTTPS=true once it does.
      HTTPS: ${HTTPS:-false}
      # Password-reset links are built from this, so it has to be the URL the
      # browser actually uses — not the container's own address.
      APP_URL: ${APP_URL:-http://localhost:${APP_PORT:-8080}}
      # Optional. With none of these set, invite and reset links go to
      # `docker compose logs backend` instead of an inbox.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Read by services/google.ts to verify sign-in tokens. Without it the
      # Google button is present but every attempt is rejected.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Optional. Where member photos go. With none of these set, photos fall
      # back to a base64 column on the member's row and the app works
      # unchanged — S3 is what stops a 2MB image riding along on every query.
      #
      # The bucket must be PRIVATE. Nothing here ever produces an unsigned URL;
      # a public bucket would undo that on its own. See the Member photos
      # section of DOCS.md for the one-time lockdown.
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      # Where JazzCash/Easypaisa send their callbacks, so it must be the
      # public URL of the API as their servers see it — not the container's
      # address and not localhost, or a payment is never confirmed and the
      # member's renewal stays pending forever.
      APP_BASE_URL: ${APP_BASE_URL:-}
      # Where the member's browser lands afterwards. Defaults to APP_URL,
      # which is already the URL the browser actually uses.
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-${APP_URL:-http://localhost:${APP_PORT:-8080}}}
      # Optional. With none of these set the portal still works — a renewal
      # becomes a front-desk request for staff to confirm, and nothing is ever
      # marked paid without that confirmation.
      #
      # The integrity salt and hash key are what sign and verify callbacks:
      # they are passwords, not identifiers. Anyone holding one can forge a
      # payment confirmation.
      JAZZCASH_MERCHANT_ID: ${JAZZCASH_MERCHANT_ID:-}
      JAZZCASH_PASSWORD: ${JAZZCASH_PASSWORD:-}
      JAZZCASH_INTEGRITY_SALT: ${JAZZCASH_INTEGRITY_SALT:-}
      # Defaults to sandbox in code. Set this to the live URL when going live.
      JAZZCASH_POST_URL: ${JAZZCASH_POST_URL:-}
      EASYPAISA_STORE_ID: ${EASYPAISA_STORE_ID:-}
      EASYPAISA_HASH_KEY: ${EASYPAISA_HASH_KEY:-}
      EASYPAISA_POST_URL: ${EASYPAISA_POST_URL:-}
      # When the daily expiry reminder runs, in this container's timezone —
      # which is UTC unless TZ is set, so 9am here is not 9am in Karachi.
      REMINDER_CRON: ${REMINDER_CRON:-0 9 * * *}
      # When fingerprints past their retention window are deleted, and how long
      # after a member lapses that window closes. See the retention note in
      # README.md — the defaults are about five months of silence.
      FINGERPRINT_RETENTION_CRON: ${FINGERPRINT_RETENTION_CRON:-0 3 * * *}
      FINGERPRINT_RETENTION_GRACE_DAYS: ${FINGERPRINT_RETENTION_GRACE_DAYS:-90}
      # Set TZ so the schedules above mean what they say locally, and so log
      # timestamps match the clock on the wall.
      TZ: ${TZ:-UTC}
      # false stops this container running scheduled work. Only worth setting
      # if you run more than one backend.
      RUN_JOBS: ${RUN_JOBS:-true}
      # Error reporting. Without it every failure is a line in
      # `docker compose logs` that nobody is reading at the moment it happens,
      # and the container can be recycled before anyone looks. Structured
      # request logs are written either way; this is what makes an error
      # *arrive*. See the Monitoring section of README.md.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      # Lets a stack trace name the deploy it came from.
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      # Performance tracing, billed per transaction and off by default. The
      # value here is errors; sample this only if latency becomes a question.
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      additional_contexts:
        src: ../frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  db-data:
