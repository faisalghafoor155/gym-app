name: gym-app

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # The build context is this docker folder (which owns .dockerignore);
  # the app source comes in as a named context so no Docker files have to
  # live inside backend/ or frontend/.
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
      additional_contexts:
        src: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5000
      NODE_ENV: production
      # The browser talks to nginx, which proxies /api to this container, so
      # API calls are same-origin and no cross-origin allowlist is needed.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # One proxy (the nginx container) sits in front of the API, so per-IP
      # rate limiting reads the real client IP instead of nginx's.
      TRUST_PROXY_HOPS: 1
      # This stack is served over plain http on localhost. A Secure session
      # cookie would be dropped by the browser there, so it is switched off
      # until the app sits behind TLS — set HTTPS=true once it does.
      HTTPS: ${HTTPS:-false}
      # Password-reset links are built from this, so it has to be the URL the
      # browser actually uses — not the container's own address.
      APP_URL: ${APP_URL:-http://localhost:${APP_PORT:-8080}}
      # Optional. Unset means reset links go to `docker compose logs backend`
      # instead of an inbox.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Read by services/google.ts to verify sign-in tokens. Without it the
      # Google button is present but every attempt is rejected.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      additional_contexts:
        src: ../frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  db-data:
