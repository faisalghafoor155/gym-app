<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GymPro</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
    }
    .logo-container {
      position: relative;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      opacity: 0.3;
      filter: blur(12px);
      animation: pulse 2.5s infinite alternate ease-in-out;
    }
    .logo-box {
      position: relative;
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #4f46e5, #2563eb);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }
    .logo-icon {
      width: 38px;
      height: 38px;
      color: #ffffff;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 30px;
      font-weight: 400;
    }
    .progress-bar-container {
      width: 240px;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 14px;
    }
    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 9999px;
      animation: indeterminate 1.8s infinite ease-in-out;
    }
    .status-text {
      font-size: 12px;
      color: #64748b;
      font-weight: 500;
      transition: color 0.3s;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.25; }
      100% { transform: scale(1.15); opacity: 0.5; }
    }
    @keyframes indeterminate {
      0% { left: -40%; width: 40%; }
      50% { left: 30%; width: 60%; }
      100% { left: 100%; width: 40%; }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="pulse-ring"></div>
    <div class="logo-box">
      <svg class="logo-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
      </svg>
    </div>
  </div>
  <h1>GymPro</h1>
  <div class="subtitle">Desktop Edition</div>

  <div class="progress-bar-container">
    <div class="progress-bar"></div>
  </div>
  <div class="status-text" id="status">Initializing desktop app...</div>

  <script>
    const { ipcRenderer } = require('electron');
    ipcRenderer.on('splash:status', (_event, message) => {
      const el = document.getElementById('status');
      if (el) el.textContent = message;
    });
  </script>
</body>
</html>
