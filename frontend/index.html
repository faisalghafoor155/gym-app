<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GymPro</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!--
      Two theme-colors, because installed standalone the browser paints the
      title bar with this rather than with anything the app renders. One value
      would leave a dark-mode user with a white strip above a black app.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#863bff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020617" />
    <!--
      Applied before the first paint, and before React mounts.

      ThemeContext sets this same class, but it cannot run until the bundle has
      parsed — by which time a dark-mode user has already been shown a full
      white page. Inline and synchronous is the only placement that avoids it.
      Kept deliberately tiny and duplicated rather than imported, since a
      module script would be deferred and lose the whole point.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark = stored === 'dark' || (stored !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) { /* blocked storage just means the default theme */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
