<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="flow" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <!-- Its crossbar is a dumbbell, drawn first so the G runs over the end of the handle. -->
  <g fill="#ffffff">
    <rect x="262" y="246" width="130" height="20" rx="10"/>
    <rect x="242" y="206" width="26" height="100" rx="10"/>
    <rect x="272" y="224" width="16" height="64" rx="7"/>
    <rect x="334" y="224" width="16" height="64" rx="7"/>
    <rect x="354" y="206" width="26" height="100" rx="10"/>
  </g>
  <!-- The G: one stroke that starts top-right and flows the long way round. -->
  <path d="M 362 150 A 150 150 0 1 0 406 256" fill="none" stroke="url(#flow)"
        stroke-width="58" stroke-linecap="round"/>
</svg>
